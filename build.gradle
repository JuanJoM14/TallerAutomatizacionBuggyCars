buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
	id 'io.github.jumosqu12.screenplayarchitecture' version '2.0.1'
	id 'java'
    id 'eclipse'
    id 'idea'
}

group 'co.com.udea.certificacion.taller'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

ext {
    serenityVersion = '4.1.0'
    serenityCucumberVersion = '4.1.0'
    lombokVersion = '1.18.22'
    junit = '4.13.2'
    hamcrest = '1.3'
    serenityWebVersion = '4.1.0'
}

dependencies {
    implementation "net.serenity-bdd:serenity-core:$rootProject.ext.serenityVersion"
    implementation "net.serenity-bdd:serenity-junit:$rootProject.ext.serenityVersion"
    implementation "net.serenity-bdd:serenity-screenplay:$rootProject.ext.serenityVersion"
    implementation "net.serenity-bdd:serenity-cucumber:$rootProject.ext.serenityCucumberVersion"
    implementation 'org.slf4j:slf4j-simple:2.0.5'
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:$rootProject.ext.serenityWebVersion"

    //Test compilation
    testImplementation "junit:junit:$rootProject.ext.junit"
    testImplementation "org.hamcrest:hamcrest-all:$rootProject.ext.hamcrest"
    implementation 'org.slf4j:slf4j-simple:2.0.5'
    testImplementation("io.github.bonigarcia:webdrivermanager:5.4.1")

    //Lombok dependencies
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor  "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly  "org.projectlombok:lombok:${lombokVersion}"

    //Additional library
    implementation group: 'org.apache.commons', name: 'commons-dbcp2', version: '2.12.0'

}

tasks.named('test') {
    // System configs

}

tasks.register('serenityReport', JavaExec) {
    group = 'verification'
    description = 'Generates Serenity BDD aggregate report from test results'
    dependsOn test
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'co.com.udea.certificacion.taller.buggycars.runners.SerenityReportMain'
}

tasks.register('copySerenityReportResources', Copy) {
    group = 'verification'
    description = 'Copies Serenity static report resources (css/js/images) into the report output folder'
    dependsOn 'serenityReport'

    def serenityResourcesJar = sourceSets.test.runtimeClasspath.find {
        it.name.startsWith('serenity-report-resources-') && it.name.endsWith('.jar')
    }

    if (serenityResourcesJar != null) {
        from(zipTree(serenityResourcesJar)) {
            include 'report-resources/**'
            eachFile { details ->
                details.path = details.path.replaceFirst('report-resources/', '')
            }
            includeEmptyDirs = false
        }
    }

    into "$projectDir/target/site/serenity"

    doFirst {
        def wrongResourceFile = file("$projectDir/target/site/serenity/serenity-resources")
        if (wrongResourceFile.exists() && wrongResourceFile.isFile()) {
            wrongResourceFile.delete()
        }
    }
}

tasks.named('serenityReport') {
    finalizedBy 'copySerenityReportResources'
}
